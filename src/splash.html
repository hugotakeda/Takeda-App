<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#09080d">
  <title>Takeda</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      color: #f5f2f7;
      font-family: 'Inter', 'Segoe UI Variable', 'Segoe UI', sans-serif;
      text-align: center;
      user-select: none;
    }

    .splash {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: calc(100% - 4px);
      height: calc(100% - 4px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 20px;
      background:
        radial-gradient(circle at 50% 37%, rgba(167, 145, 232, 0.14), transparent 34%),
        #09080d;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.025);
      -webkit-app-region: drag;
    }

    .mark {
      display: block;
      width: 82px;
      height: 82px;
      object-fit: contain;
      filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.42));
      animation: markIn 0.62s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .wordmark {
      margin-top: 10px;
      color: #f6f2f7;
      font-size: 1.03rem;
      font-weight: 730;
      letter-spacing: -0.045em;
    }

    .greeting {
      margin-top: 5px;
      color: #77717e;
      font-size: 0.59rem;
    }

    .username {
      color: #b8aaf0;
      font-weight: 620;
    }

    .progress {
      width: 86px;
      height: 2px;
      margin-top: 17px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
    }

    .progress::after {
      content: '';
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8f78ce, #dfd7f8);
      animation: progress 1.15s ease-in-out infinite;
    }

    @keyframes markIn {
      from { opacity: 0; transform: translateY(8px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes progress {
      0% { transform: translateX(-110%); }
      55% { transform: translateX(92%); }
      100% { transform: translateX(250%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark,
      .progress::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="splash">
    <img class="mark" src="../assets/takeda-icon-256.png" alt="Takeda">
    <div class="wordmark">Takeda</div>
    <p class="greeting"><span id="greeting">Olá, </span><span class="username">@<span id="username">user</span></span></p>
    <div class="progress" aria-hidden="true"></div>
  </main>

  <script>
    if (window.pulso && window.pulso.getUsername) {
      window.pulso.getUsername()
        .then((name) => {
          const username = document.getElementById('username');
          if (username) username.textContent = name;
        })
        .catch(() => {});
    }

    if (window.pulso && window.pulso.getLocale) {
      window.pulso.getLocale().then((locale) => {
        const greeting = document.getElementById('greeting');
        if (greeting) {
          greeting.textContent = locale && locale.toLowerCase() === 'pt-br' ? 'Olá, ' : 'Hello, ';
        }
      });
    }
  </script>
</body>
</html>
